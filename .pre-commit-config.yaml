# Pre-commit hooks: run on `git commit` -- same four checks as CI.
# Mirrors .github/workflows/pythonpackage.yml (ruff format -> ruff -> mypy -> pytest).
#
# Install once per clone:  poetry run pre-commit install
# Run manually:            poetry run pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]

      - id: ruff
        name: ruff lint
        entry: poetry run ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        files: ^(skillbridge|allegrobridge)/

      - id: pytest
        name: pytest
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
