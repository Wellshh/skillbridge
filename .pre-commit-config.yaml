# Pre-commit hooks: run on `git commit` -- same checks as CI.
# Mirrors .github/workflows/pythonpackage.yml (ruff format -> ruff -> mypy -> pyright -> pytest).
#
# Install once per clone:  poetry run pre-commit install
# Run manually:            poetry run pre-commit run --all-files

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff
        name: ruff lint
        entry: poetry run ruff check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        files: ^(skillbridge|allegrobridge)/
        stages: [pre-commit]

      - id: pyright
        name: pyright
        entry: poetry run pyright --warnings
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
