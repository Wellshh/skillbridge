name: Python package

on: [push]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package
      run: |
        python -m pip install -e ".[dev]"

    - name: Check with ruff format
      if: matrix.python-version == '3.10'
      run: |
        ruff format --check

    - name: Check with ruff
      if: matrix.python-version == '3.10'
      run: |
        ruff check

    - name: Check with mypy
      if: matrix.python-version == '3.10'
      run: |
        mypy allegrobridge

    - name: Check with pyright
      if: matrix.python-version == '3.10'
      run: |
        pyright --warnings --pythonpath "$(python -c 'import sys; print(sys.executable)')" allegrobridge

    - name: Check typing fixtures
      if: matrix.python-version == '3.10'
      run: |
        mypy tests/typing_allegrobridge_axl_stubs.py
        pyright --warnings --pythonpath "$(python -c 'import sys; print(sys.executable)')" tests/typing_allegrobridge_axl_stubs.py

    - name: Check generated Allegro stubs
      if: matrix.python-version == '3.10'
      run: |
        python scripts/generate_axl_stubs.py --check

    - name: Check Cadence assessment gate
      if: matrix.python-version == '3.10'
      run: |
        pytest .agents/skills/cadence-skill-agent/tests/test_verify_assessment.py -q
        python .agents/skills/cadence-skill-agent/scripts/verify_assessment.py \
          .agents/skills/cadence-skill-agent/tests/fixtures/assessment-smoke.json \
          --root .agents/skills/cadence-skill-agent/skill-references

    - name: Check Cadence quality baselines
      if: matrix.python-version == '3.10'
      run: |
        python .agents/skills/cadence-skill-agent/scripts/build_reference_indexes.py --check
        python .agents/skills/cadence-skill-agent/scripts/check_signatures.py
        python .claude/scripts/build_orcad_index.py --check
        python .agents/skills/cadence-skill-agent/scripts/validate_skill_api.py --check
        python .agents/skills/cadence-skill-agent/scripts/eval_retrieval.py --check
        python .agents/skills/cadence-skill-agent/scripts/eval_generation.py \
          --samples .claude/eval-samples --check

    - name: Test with pytest
      run: |
        pytest

    - name: Benchmark correctness smoke
      if: matrix.python-version == '3.12'
      run: |
        pytest benchmark/test_micro.py --benchmark-disable --no-cov

  build-documentation:
    name: Build MkDocs Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install -e ".[doc]"
          mkdocs build --strict
