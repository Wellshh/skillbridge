name: Python package

on: [push]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package
      run: |
        python -m pip install -e ".[dev]"

    - name: Check with ruff format
      if: matrix.python-version == '3.10'
      run: |
        ruff format --check

    - name: Check with ruff
      if: matrix.python-version == '3.10'
      run: |
        ruff check

    - name: Check with mypy
      if: matrix.python-version == '3.10'
      run: |
        mypy skillbridge allegrobridge

    - name: Check with pyright
      if: matrix.python-version == '3.10'
      run: |
        pyright --warnings skillbridge allegrobridge

    - name: Check typing fixtures
      if: matrix.python-version == '3.10'
      run: |
        mypy tests/typing_allegrobridge_axl_stubs.py
        pyright --warnings tests/typing_allegrobridge_axl_stubs.py

    - name: Check generated Allegro stubs
      if: matrix.python-version == '3.10'
      run: |
        python scripts/generate_axl_stubs.py --check

    - name: Test with pytest
      run: |
        pytest

  build-documentation:
    name: Build MkDocs Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install -e ".[doc]"
          mkdocs build --strict
