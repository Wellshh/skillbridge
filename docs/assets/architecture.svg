<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace; fill: #333A45; }
    .t { font-weight: 700; font-size: 15px; }
    .b { font-size: 13px; }
    .c { font-size: 11px; fill: #6B7383; }
    @media (prefers-color-scheme: dark) {
      text { fill: #D7DCE5; }
      .c { fill: #8A93A5; }
    }
  </style>
  <g fill="none" stroke-width="2.5">
    <rect x="60" y="24" width="600" height="112" rx="8" stroke="#E8A33D" fill="#E8A33D" fill-opacity="0.07"/>
    <rect x="60" y="176" width="600" height="88" rx="8" stroke="#4FD8E0" fill="#4FD8E0" fill-opacity="0.06"/>
    <rect x="60" y="304" width="600" height="72" rx="8" stroke="#6FD08C" fill="#6FD08C" fill-opacity="0.06"/>
  </g>
  <g fill="none" stroke="#E8A33D" stroke-width="3" stroke-linecap="round">
    <line x1="220" y1="136" x2="220" y2="176"/>
    <line x1="500" y1="136" x2="500" y2="176"/>
    <line x1="220" y1="264" x2="220" y2="304"/>
    <line x1="500" y1="264" x2="500" y2="304"/>
    <circle cx="220" cy="156" r="5"/>
    <circle cx="500" cy="156" r="5"/>
    <circle cx="220" cy="284" r="5"/>
    <circle cx="500" cy="284" r="5"/>
  </g>
  <text class="c" x="524" y="289">SKILL frames</text>
  <text class="t" x="84" y="54">allegrobridge/</text>
  <text class="b" x="84" y="80">Allegro (lifecycle) → Workspace → Session → Domain APIs</text>
  <text class="b" x="84" y="104">board · components · layers · nets · padstacks · pins · symbols · vias · ext.&lt;custom&gt;</text>
  <text class="c" x="636" y="126" text-anchor="end">frozen pydantic DTOs</text>
  <text class="t" x="84" y="206">skillbridge/ (kernel)</text>
  <text class="b" x="84" y="230">Workspace/RemoteFunction → Translator → Channel → Pipe</text>
  <text class="c" x="84" y="252">derived from unihd-cag/skillbridge</text>
  <text class="t" x="84" y="334">Allegro PCB Editor process</text>
  <text class="b" x="84" y="358">python_server.il (IPC) + allegro_server.il (txn kernel)</text>
</svg>
