[build-system]
requires = ["setuptools>=57", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
version = "1.8.0"

[project]
name = "skillbridge"
authors = [
    {name = "Niels Buwen", email = "dev@niels-buwen.de"},
    {name = "Tobias Markus", email = "tobias_markus@gmx.net"},
]
description = "A seamless Python remote bridge to Cadence's Skill in Virtuoso"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.10,<2.11",
    "psutil>=7,<8",
    "typing_extensions>=4.6",
]
urls = {Repository = "https://github.com/unihd-cag/skillbridge"}
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "skillbridge.version.__version__"}

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "types-psutil",
    "ruff>=0.2.1",
]
doc = [
    "sphinx"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mypy<2",
    "types-psutil",
    "ruff>=0.2.1",
    "pre-commit",
]
doc = [
    "sphinx",
]

[project.scripts]
skillbridge = "skillbridge.__main__:main"

[tool.setuptools.packages.find]
include = ["skillbridge*", "allegrobridge*"]
namespaces = false

[tool.setuptools.package-data]
allegrobridge = [
    "py.typed",
    "client/*.pyi",
    "assets/*.txt",
    "server/*.il",
    "server/extensions/*.il",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=skillbridge --cov=allegrobridge --cov-report=html --cov-report=term:skip-covered --cov-branch --no-cov-on-fail --cov-fail-under=0"
markers = [
    "allegro: integration tests requiring an Allegro server (enabled with --allegro)",
    "integration: exercises real sockets, threads, pipes, or subprocesses",
]

[tool.coverage.report]
precision = 2
exclude_also = ["raise NotImplementedError", "@overload"]

[tool.mypy]
python_version = "3.12"
files = ["skillbridge", "allegrobridge"]
exclude = ["tests"]
platform = "linux"
pretty = true
show_error_context = true

disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

implicit_optional = false
strict_optional = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

allow_untyped_globals = false
allow_redefinition = false
implicit_reexport = false
strict_equality = true

[tool.ruff]
preview = true
exclude = ["venv", "env", "build", ".agents", ".claude"]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "builtin-attribute-shadowing",
    "ANN10", "any-type",
    "no-explicit-stacklevel",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "DOC",
    "raw-string-in-exception", "f-string-in-exception",
    "boolean-type-hint-positional-argument", "boolean-default-value-positional-argument",
    "logging-f-string",
    "single-line-implicit-string-concatenation",
    "invalid-module-name",
    "too-many-return-statements", "no-self-use",
    "eq-without-hash", "bad-dunder-method-name",
    "pytest-fixture-incorrect-parentheses-style", "pytest-incorrect-pytest-import",
    "builtin-open",
    "non-empty-init-module",
    "assert", "hardcoded-temp-file", "suspicious-url-open-usage", "suspicious-non-cryptographic-random-usage", "suspicious-subprocess-import",
    "print",
    "typing-only-first-party-import", "typing-only-third-party-import", "typing-only-standard-library-import",
    "relative-imports",
    "raise-vanilla-args", "type-check-without-type-error", "error-instead-of-exception",
]

[tool.ruff.lint.per-file-ignores]
"allegrobridge/client/api/_rpc.py" = [
    "private-member-access",
]
"tests/*" = [
    "ANN",
    "unused-function-argument",
    "magic-value-comparison",
    "subprocess-without-shell-equals-true", "start-process-with-partial-path",
    "private-member-access",
    "try-except-in-loop",
    "assert-raises-exception",
    "pytest-raises-too-broad",
]
"update_version.py" = [
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
]
"docs/conf.py" = [
    "implicit-namespace-package",
    "builtin-variable-shadowing",
]
"*" = [
    "bad-quotes-inline-string",
]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.format]
docstring-code-format = true
quote-style = "preserve"
